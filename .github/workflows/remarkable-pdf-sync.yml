name: reMarkable Aufgaben PDF Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger protected PDF sync
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=remarkable-pdf-sync")
          TOKEN=$(printf '%s' "$TOKEN_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 300 \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            https://remarkable-aufgaben-sync.onrender.com/run
